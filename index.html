<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Portal | Sign In</title>
    <!-- Meta Description for SEO -->
    <meta name="description" content="Access your workspace securely using our premium, glassmorphic login interface featuring biometric-level visual aesthetics.">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative Ambient Background Blobs -->
    <div class="bg-blob blob-1" id="blob1"></div>
    <div class="bg-blob blob-2" id="blob2"></div>
    <div class="bg-blob blob-3" id="blob3"></div>

    <!-- Mouse Tracking Spotlight Spot -->
    <div class="mouse-spotlight" id="mouseSpotlight"></div>

    <!-- Main Container -->
    <main class="login-wrapper">
        <div class="login-card" id="loginCard">
            <!-- Glass Overlay Border Glow -->
            <div class="card-glow"></div>
            
            <div class="card-content">
                <!-- Branding Header -->
                <header class="brand-header">
                    <div class="brand-logo">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#8a2be2" />
                                    <stop offset="50%" stop-color="#ff007f" />
                                    <stop offset="100%" stop-color="#00f0ff" />
                                </linearGradient>
                            </defs>
                            <polygon points="50,15 85,75 15,75" fill="none" stroke="url(#logoGrad)" stroke-width="8" stroke-linejoin="round"/>
                            <polygon points="50,35 70,70 30,70" fill="url(#logoGrad)" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1 class="brand-title">Aether Portal</h1>
                    <p class="brand-subtitle">Enter your credentials to access your secure workspace.</p>
                </header>

                <!-- Social Authentication -->
                <div class="social-login-container">
                    <button class="social-btn" id="btnGoogle" type="button" aria-label="Sign in with Google">
                        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        <span>Google</span>
                    </button>
                    <button class="social-btn" id="btnGithub" type="button" aria-label="Sign in with GitHub">
                        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#FFFFFF"/>
                        </svg>
                        <span>GitHub</span>
                    </button>
                </div>

                <div class="divider">
                    <span>or sign in with email</span>
                </div>

                <!-- Form Section -->
                <form class="login-form" id="loginForm" novalidate>
                    <!-- Email Field -->
                    <div class="input-group" id="groupEmail">
                        <label class="input-label" for="txtEmail">Email Address</label>
                        <div class="input-container">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="currentColor"/>
                                </svg>
                            </span>
                            <input 
                                type="email" 
                                id="txtEmail" 
                                class="form-input" 
                                placeholder="name@example.com" 
                                autocomplete="email" 
                                required
                            >
                            <span class="validity-indicator">
                                <svg viewBox="0 0 24 24" class="valid-icon" xmlns="http://www.w3.org/2000/svg">
                                    <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                        <span class="error-message" id="errEmail">Please enter a valid email address</span>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group" id="groupPassword">
                        <label class="input-label" for="txtPassword">Password</label>
                        <div class="input-container">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="txtPassword" 
                                class="form-input" 
                                placeholder="Enter your password" 
                                autocomplete="current-password" 
                                required
                            >
                            <button type="button" class="btn-toggle-password" id="btnTogglePassword" aria-label="Toggle password visibility">
                                <!-- Eye Open Icon -->
                                <svg class="icon-eye-open" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
                                </svg>
                                <!-- Eye Closed Icon (Hidden initially) -->
                                <svg class="icon-eye-closed hide" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.39 2.69-3.21 3.44-5.24-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                        <span class="error-message" id="errPassword">Password must be at least 6 characters</span>
                    </div>

                    <!-- Helpers Row (Remember Me & Forgot Password) -->
                    <div class="form-helpers">
                        <label class="remember-me-container">
                            <input type="checkbox" id="chkRemember">
                            <span class="custom-checkbox">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <span class="checkbox-label">Keep me logged in</span>
                        </label>
                        <a href="#" class="forgot-password-link" id="lnkForgot">Forgot Password?</a>
                    </div>

                    <!-- Action Button -->
                    <button type="submit" class="btn-submit" id="btnSubmit">
                        <span class="btn-text">Sign In to Portal</span>
                        <div class="loader" id="submitLoader"></div>
                    </button>
                </form>

                <!-- Signup Prompt -->
                <footer class="card-footer">
                    <p>New to Aether Portal? <a href="signup.html" class="signup-link">Create an account</a></p>
                </footer>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
