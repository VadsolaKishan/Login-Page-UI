<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Portal | Sign Up</title>
    <!-- Meta Description for SEO -->
    <meta name="description" content="Create your workspace securely using our premium, glassmorphic login interface featuring biometric-level visual aesthetics.">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative Ambient Background Blobs -->
    <div class="bg-blob blob-1" id="blob1"></div>
    <div class="bg-blob blob-2" id="blob2"></div>
    <div class="bg-blob blob-3" id="blob3"></div>

    <!-- Mouse Tracking Spotlight Spot -->
    <div class="mouse-spotlight" id="mouseSpotlight"></div>

    <!-- Main Container -->
    <main class="login-wrapper">
        <div class="login-card" id="loginCard">
            <!-- Glass Overlay Border Glow -->
            <div class="card-glow"></div>
            
            <div class="card-content">
                <!-- Branding Header -->
                <header class="brand-header">
                    <div class="brand-logo">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#8a2be2" />
                                    <stop offset="50%" stop-color="#ff007f" />
                                    <stop offset="100%" stop-color="#00f0ff" />
                                </linearGradient>
                            </defs>
                            <polygon points="50,15 85,75 15,75" fill="none" stroke="url(#logoGrad)" stroke-width="8" stroke-linejoin="round"/>
                            <polygon points="50,35 70,70 30,70" fill="url(#logoGrad)" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1 class="brand-title">Aether Portal</h1>
                    <p class="brand-subtitle">Create an account to access your secure workspace.</p>
                </header>

                <!-- Form Section -->
                <form class="login-form" id="loginForm" novalidate>
                    <!-- Full Name Field -->
                    <div class="input-group" id="groupName">
                        <label class="input-label" for="txtName">Full Name</label>
                        <div class="input-container">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/>
                                </svg>
                            </span>
                            <input 
                                type="text" 
                                id="txtName" 
                                class="form-input" 
                                placeholder="John Doe" 
                                autocomplete="name" 
                                required
                            >
                            <span class="validity-indicator">
                                <svg viewBox="0 0 24 24" class="valid-icon" xmlns="http://www.w3.org/2000/svg">
                                    <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                        <span class="error-message" id="errName">Please enter your full name</span>
                    </div>

                    <!-- Email Field -->
                    <div class="input-group" id="groupEmail">
                        <label class="input-label" for="txtEmail">Email Address</label>
                        <div class="input-container">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="currentColor"/>
                                </svg>
                            </span>
                            <input 
                                type="email" 
                                id="txtEmail" 
                                class="form-input" 
                                placeholder="name@example.com" 
                                autocomplete="email" 
                                required
                            >
                            <span class="validity-indicator">
                                <svg viewBox="0 0 24 24" class="valid-icon" xmlns="http://www.w3.org/2000/svg">
                                    <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                        <span class="error-message" id="errEmail">Please enter a valid email address</span>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group" id="groupPassword">
                        <label class="input-label" for="txtPassword">Password</label>
                        <div class="input-container">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="txtPassword" 
                                class="form-input" 
                                placeholder="Enter your password" 
                                autocomplete="new-password" 
                                required
                            >
                            <button type="button" class="btn-toggle-password" id="btnTogglePassword" aria-label="Toggle password visibility">
                                <!-- Eye Open Icon -->
                                <svg class="icon-eye-open" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
                                </svg>
                                <!-- Eye Closed Icon (Hidden initially) -->
                                <svg class="icon-eye-closed hide" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.39 2.69-3.21 3.44-5.24-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                        <span class="error-message" id="errPassword">Password must be at least 6 characters</span>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="input-group" id="groupConfirmPassword">
                        <label class="input-label" for="txtConfirmPassword">Confirm Password</label>
                        <div class="input-container">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 2C9.24 2 7 4.24 7 7l5 7v6h4v-6l5-7c0-2.76-2.24-5-5-5-1.92 0-3.56 1.09-4.34 2.66A4.98 4.98 0 0012 2zm0 8.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 5.5 12 5.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="txtConfirmPassword" 
                                class="form-input" 
                                placeholder="Confirm your password" 
                                autocomplete="new-password" 
                                required
                            >
                            <button type="button" class="btn-toggle-password" id="btnToggleConfirmPassword" aria-label="Toggle password visibility">
                                <!-- Eye Open Icon -->
                                <svg class="icon-eye-open" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
                                </svg>
                                <!-- Eye Closed Icon (Hidden initially) -->
                                <svg class="icon-eye-closed hide" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.39 2.69-3.21 3.44-5.24-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" fill="currentColor"/>
                                </svg>
                            </button>
                            <span class="validity-indicator">
                                <svg viewBox="0 0 24 24" class="valid-icon" xmlns="http://www.w3.org/2000/svg">
                                    <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </div>
                        <span class="error-message" id="errConfirmPassword">Passwords do not match</span>
                    </div>

                    <!-- Spacer -->
                    <div style="height: 2px;"></div>

                    <!-- Action Button -->
                    <button type="submit" class="btn-submit" id="btnSubmit">
                        <span class="btn-text">Create Account</span>
                        <div class="loader" id="submitLoader"></div>
                    </button>
                </form>

                <!-- Signup Prompt -->
                <footer class="card-footer">
                    <p>Already have an account? <a href="index.html" class="signup-link">Sign In</a></p>
                </footer>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
